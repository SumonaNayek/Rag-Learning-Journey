[project]
name = "rag-udemy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "docx2txt>=0.9",
    "faiss-cpu>=1.15.0",
    "ipykernel>=7.3.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.2",
    "langchain-text-splitters>=1.1.2",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pdfminer>=20191125",
    "pymupdf>=1.28.2",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.7.0",
    "tiktoken>=0.13.0",
    "unstructured[docx]>=0.25.2",
]

[project.scripts]
rag-udemy = "rag_udemy:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
